# =============================================================================
# Drop-in sshd — High-Fortress User
# =============================================================================
# Ne remplace PAS /etc/ssh/sshd_config. Port existant conservé.
# PasswordAuthentication NON forcé à no (session desktop).
# AllowUsers NON posé (ne pas se verrouiller).
#
# AuthenticationMethods volontairement absent :
#   « publickey,password » (virgule) = ET → lockout desktop.
#   publickey OU password = défaut OpenSSH dès que les deux sont yes.
# =============================================================================

PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication yes
KbdInteractiveAuthentication no

UsePAM yes
Banner /etc/ssh/sshd_banner

LogLevel VERBOSE

MaxAuthTries 4
ClientAliveInterval 300
ClientAliveCountMax 2
LoginGraceTime 30

IgnoreRhosts yes
PermitEmptyPasswords no
PermitUserEnvironment no
HostbasedAuthentication no

X11Forwarding no
AllowTcpForwarding yes
AllowAgentForwarding yes
PermitTunnel no

StrictModes yes
MaxStartups 10:30:60
MaxSessions 10
DebianBanner no
