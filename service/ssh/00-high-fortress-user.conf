# =============================================================================
# Fichier    : service/ssh/00-high-fortress-user.conf
# Créé le    : 2026-09-21
# Créateur   : palarchsys
#
# Rôle
#   Première règle SSH du poste. Le nom commence par 00 pour être lu
#   avant les autres fichiers de sshd_config.d.
# =============================================================================

# OpenSSH garde la première valeur rencontrée. Ubuntu inclut
# sshd_config.d/*.conf au début de sshd_config, dans l'ordre alphabétique.
# Un fichier 50-cloud-init.conf pose souvent :
#   PermitRootLogin prohibit-password
#   PasswordAuthentication no
# Placé en 99-, notre fichier arrivait trop tard et ces deux lignes
# restaient sans effet. En 00-, elles s'appliquent.
#
# Le port d'écoute n'est pas modifié.
# PasswordAuthentication reste yes : le compte du bureau peut se connecter
# avec son mot de passe. AllowUsers n'est pas posé.
# AuthenticationMethods n'est pas posé : la virgule signifierait
# « clé ET mot de passe », ce qui bloquerait une session sans clé.

PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication yes
KbdInteractiveAuthentication no

UsePAM yes
Banner /etc/ssh/sshd_banner

LogLevel VERBOSE

MaxAuthTries 4
ClientAliveInterval 300
ClientAliveCountMax 2
LoginGraceTime 30

IgnoreRhosts yes
PermitEmptyPasswords no
PermitUserEnvironment no
HostbasedAuthentication no

X11Forwarding no
AllowTcpForwarding yes
AllowAgentForwarding yes
PermitTunnel no

StrictModes yes
MaxStartups 10:30:60
MaxSessions 10
DebianBanner no
