<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>${PROJECT_NAME} • ${HOSTNAME} • ${DATE}</title>
</head>
<body style="margin:0;background:#0f172a;font-family:system-ui,sans-serif;">
<div style="width:840px;margin:20px auto;background:#111827;border-radius:12px;overflow:hidden;">
    <div style="padding:20px 25px;border-bottom:1px solid #334155;">
        <h1 style="font-size:22px;color:#f8fafc;margin:0;">${TITLE}</h1>
        <div style="font-size:13px;color:#94a3b8;margin-top:4px;">${PROJECT_NAME} • ${HOSTNAME} • ${DATE}</div>
    </div>
    <div style="padding:25px;">
        <p style="color:#cbd5e1;font-size:13px;"><strong>Module :</strong> ${MODULE_NAME}</p>
        <pre style="background:#020617;border:1px solid #334155;border-radius:8px;padding:16px;color:#e2e8f0;white-space:pre-wrap;font-size:12px;">${CONTENT}</pre>
        <!--NOTE_START-->
        <div style="margin-top:18px;background:#1e293b;border:1px solid #334155;border-radius:8px;padding:16px;">
            <p style="color:#e2e8f0;font-size:13px;line-height:1.55;margin:0 0 12px;">${NOTE}</p>
            <pre style="background:#020617;border:1px solid #334155;border-radius:8px;padding:12px;color:#86efac;white-space:pre-wrap;font-size:12px;margin:0;">${NOTE_CMD}</pre>
        </div>
        <!--NOTE_END-->
    </div>
    <div style="background:#1e293b;padding:14px 25px;font-size:11px;color:#64748b;text-align:center;">${PROJECT_NAME}</div>
</div>
</body>
</html>
