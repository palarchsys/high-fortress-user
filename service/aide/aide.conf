# =============================================================================
# AIDE — High-Fortress User (workstation)
# =============================================================================
# Surveiller binaires / etc / boot. Exclure home, snaps, steam, libvirt, caches.

database_in=file:/var/lib/aide/aide.db
database_out=file:/var/lib/aide/aide.db.new
gzip_dbout=yes

# Espace après « = » : Lynis FINT-4402 exige « = .*(sha256|sha512) »
All = p+i+n+u+g+s+b+acl+xattrs+sha512+sha256

/bin                            All
/sbin                           All
/usr/bin                        All
/usr/sbin                       All
/boot                           All
/lib                            All
/lib64                          All
/usr/lib                        All
/usr/lib64                      All
/etc                            All
__HF_BASE__                     All

!/opt/.*/data/
!/var/log/
!/var/cache/
!/var/tmp/
!/var/lib/docker/
!/var/lib/containerd/
!/var/lib/libvirt/
!/opt/brave.com/
!/opt/Telegram/
!/usr/share/discord/
!/var/lib/snapd/
!/var/lib/flatpak/
!/snap/
!/proc/
!/sys/
!/dev/
!/run/
!/tmp/
!/home/
!/root/.cache/
!/root/.local/

!__HF_BASE__/cron/security_logs($|/)
!__HF_BASE__/cron/cron_logs($|/)
!__HF_BASE__/cron/alerts($|/)
