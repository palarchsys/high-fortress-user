<!--
  Modèle d'alerte. Les mots TITLE, HF_PROJECT_NAME, HOSTNAME, DATE, MODULE_NAME,
  CONTENT, NOTE et NOTE_CMD, écrits avec un dollar et des accolades, sont
  remplacés à l'envoi. Le bloc NOTE_START / NOTE_END est retiré quand la note
  est vide. Pour un autre style, ajoutez un fichier .html dans ce dossier et
  nommez-le dans HF_MAIL_TEMPLATE (global.conf). Défaut : mail.html.
-->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>${HF_PROJECT_NAME} • ${HOSTNAME} • ${DATE}</title>
<style>
html { height:100%; margin:0; background:#0f172a; }
body { min-height:100vh; margin:0; background:#0f172a; font-family:system-ui,sans-serif; }
.container { box-sizing:border-box; display:flex; flex-direction:column; width:100%; min-width:400px; max-width:800px; min-height:100vh; margin:0 auto; background:#111827; }
.header { padding:24px 24px 20px; border-bottom:1px solid #334155; }
.title { font-size:22px; color:#f8fafc; margin:0; }
.subtitle { font-size:13px; color:#94a3b8; margin-top:4px; }
.content { flex:1 0 auto; min-width:0; display:flex; flex-direction:column; gap:16px; padding:24px; }
.module { color:#cbd5e1; font-size:13px; margin:0; }
.content > pre { box-sizing:border-box; display:block; min-width:0; margin:0; background:#020617; border:1px solid #334155; border-radius:8px; padding:16px; color:#e2e8f0; white-space:pre; overflow-x:auto; font-size:12px; }
.note { min-width:0; background:#1e293b; border:1px solid #334155; border-radius:8px; padding:16px; }
.note p { color:#e2e8f0; font-size:13px; line-height:1.55; margin:0 0 12px; }
.note pre { box-sizing:border-box; min-width:0; background:#020617; border:1px solid #334155; border-radius:8px; padding:12px; color:#86efac; white-space:pre; overflow-x:auto; font-size:12px; margin:0; }
.footer { background:#1e293b; padding:16px 24px; font-size:11px; color:#64748b; text-align:center; }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1 class="title">${TITLE}</h1>
        <div class="subtitle">${HF_PROJECT_NAME} • ${HOSTNAME} • ${DATE}</div>
    </div>
    <div class="content">
        <p class="module"><strong>Module :</strong> ${MODULE_NAME}</p>
        <pre>${CONTENT}</pre>
        <!--NOTE_START-->
        <div class="note">
            <p>${NOTE}</p>
            <pre>${NOTE_CMD}</pre>
        </div>
        <!--NOTE_END-->
    </div>
    <div class="footer">${HF_PROJECT_NAME}</div>
</div>
</body>
</html>
