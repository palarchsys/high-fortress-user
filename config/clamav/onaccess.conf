# -----------------------------------------------------------------------------
# Purpose    : On-access paths and size.
# Note       : HFU_ONACCESS_MOUNTS=1 adds /media and /mnt.
# Note       : Fixed excludes are merged by apply-scan-skip.sh.
# -----------------------------------------------------------------------------

# Shared

# Server

# Workstation

HFU_ONACCESS_MARKER="High-Fortress User onaccess"
HFU_ONACCESS_EXCLUDE_UNAME=clamav
HFU_ONACCESS_EXCLUDE_ROOTUID=yes
HFU_ONACCESS_MAX_FILE_SIZE=25M
HFU_ONACCESS_PREVENTION=yes
HFU_ONACCESS_EXTRA_SCANNING=yes
HFU_ONACCESS_MOUNTS=1
HFU_ONACCESS_FIXED_EXCLUDE="/var/lib/snapd /snap /var/lib/clamav/quarantine /var/lib/clamav/tmp /opt/high-fortress-user /var/log"
HFU_CLAMAV_TEMPORARY_DIRECTORY=/var/lib/clamav/tmp
HFU_CLAMAV_QUARANTINE=/var/lib/clamav/quarantine
HFU_CLAMONACC_BIN=/usr/sbin/clamonacc
HFU_CLAMONACC_LOG=/var/log/clamav/clamonacc.log
HFU_CLAMONACC_RESTART=on-failure
HFU_CLAMONACC_RESTART_SEC=5
HFU_CLAMAV_VIRUS_EVENT_PRESERVE=CLAM_VIRUSEVENT_FILENAME,CLAM_VIRUSEVENT_VIRUSNAME
